<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- 보안: 이 사이트 파일과 GitHub API(저장용)만 사용합니다 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <!-- 관리자 페이지는 검색에 나오지 않게 합니다 (정식 공개 후에도 지우지 마세요) -->
    <meta name="robots" content="noindex, nofollow">
    <title>관리자 | 광덕건업</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="brand/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=20261108c">
    <link rel="stylesheet" href="css/admin.css?v=20261108c">
    <script src="data/company.js?v=20261108c" defer></script>
    <script src="data/categories.js?v=20261108c" defer></script>
    <script src="data/products.js?v=20261108c" defer></script>
    <script src="data/cases.js?v=20261108c" defer></script>
    <script src="data/process.js?v=20261108c" defer></script>
    <script src="js/core.js?v=20261108c" defer></script>
    <script src="js/gallery.js?v=20261108c" defer></script>
    <script src="js/product-detail.js?v=20261108c" defer></script>
    <script src="js/admin-format.js?v=20261108c" defer></script>
    <script src="js/admin.js?v=20261108c" defer></script>
  </head>
  <body class="admin" data-root="">
    <noscript><div class="noscript">관리자 페이지는 자바스크립트를 켜야 사용할 수 있습니다.</div></noscript>

    <header class="admin-top">
      <div class="admin-top__inner">
        <p class="admin-top__title"><span class="admin-top__brand">광덕건업</span> 관리자</p>
        <div class="admin-top__actions" data-when="connected" hidden>
          <a class="btn btn--outline btn--sm" href="index.html" target="_blank" rel="noopener">사이트 보기</a>
          <button type="button" class="btn btn--outline btn--sm" data-act-global="logout">연결 끊기</button>
        </div>
      </div>
    </header>

    <main id="main" class="admin-main" tabindex="-1">
      <!-- 1. 연결 화면 -->
      <section class="admin-login" data-when="login">
        <h1 class="h-page">관리자 연결</h1>
        <p class="mt-4 text-lg">제품과 설명을 고치면 GitHub 저장소에 바로 저장되고, 1~10분 뒤 사이트에 반영됩니다.</p>
        <p class="mt-2 text-lg">처음 한 번 <strong>GitHub 토큰</strong>(저장용 열쇠)이 필요합니다. 만드는 방법은 저장소의 README ‘관리자 페이지’에 있습니다.</p>
        <label class="af mt-8">
          <span class="af__label">GitHub 토큰</span>
          <input type="password" id="token-input" autocomplete="off" spellcheck="false" placeholder="github_pat_ 로 시작하는 글자">
        </label>
        <label class="af-check mt-4">
          <input type="checkbox" id="token-remember">
          <span>이 기기에 기억하기 <span class="text-soft">(개인 컴퓨터·휴대폰에서만 켜세요)</span></span>
        </label>
        <button type="button" class="btn btn--primary btn--lg mt-6" id="token-connect">연결하기</button>
        <p class="admin-msg mt-4" id="login-msg" role="status" aria-live="polite"></p>
      </section>

      <!-- 2. 관리 화면 -->
      <section class="admin-app" data-when="connected" hidden>
        <nav class="admin-tabs" aria-label="관리 메뉴">
          <button type="button" class="admin-tabs__btn is-on" data-tab="products" aria-pressed="true">제품</button>
          <button type="button" class="admin-tabs__btn" data-tab="categories" aria-pressed="false">제품군 설명</button>
        </nav>

        <div data-panel="products">
          <div class="admin-cols">
            <aside class="admin-list" aria-label="제품 목록">
              <button type="button" class="btn btn--primary btn--block" data-act-global="add-product">+ 새 제품 추가</button>
              <ul id="product-list" class="admin-list__items"></ul>
            </aside>
            <div id="editor" class="admin-editor"></div>
          </div>
        </div>

        <div data-panel="categories" hidden>
          <div id="category-editor" class="admin-editor admin-editor--wide"></div>
        </div>
      </section>
    </main>

    <!-- 저장 줄 -->
    <div class="admin-savebar" data-when="connected" hidden>
      <div class="admin-savebar__inner">
        <p id="save-msg" class="admin-savebar__msg" role="status" aria-live="polite">변경 사항이 없습니다.</p>
        <div class="admin-savebar__actions">
          <button type="button" class="btn btn--outline" data-act-global="preview">미리보기</button>
          <button type="button" class="btn btn--primary" id="save-btn" data-act-global="save" disabled>저장하고 사이트에 반영</button>
        </div>
      </div>
    </div>

    <!-- 미리보기 -->
    <div class="admin-preview" id="preview" hidden>
      <div class="admin-preview__bar">
        <p><strong>미리보기</strong> — 저장 전 화면입니다. 실제 사이트에는 저장 후 반영됩니다.</p>
        <button type="button" class="btn btn--outline btn--sm" data-act-global="close-preview">닫기</button>
      </div>
      <div class="admin-preview__body" id="preview-main"></div>
    </div>
  </body>
</html>
