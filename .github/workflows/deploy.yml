# GitHub Pages 자동 배포
# main 브랜치에 올릴 때마다: 설치 → 타입 검사 → 린트 → 빌드 → Pages 배포
# 처음 한 번, 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 직접 실행할 수도 있음

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 설치
        run: npm install

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        # 코드 규칙 경고 때문에 확인용 배포가 막히지 않도록 일단 실패해도 계속 진행합니다.
        # 결과는 Actions 기록에서 확인하고, 문제를 정리한 뒤 이 줄을 지우세요.
        continue-on-error: true
        run: npm run lint

      - name: 빌드
        env:
          # https://아이디.github.io/저장소이름/ 주소에 맞추기
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # 예시 자료가 남아 있는 동안 검색 제외. 정식 공개 시 "true"
          NEXT_PUBLIC_ALLOW_INDEXING: "false"
        run: npm run build

      - name: Pages 설정
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
